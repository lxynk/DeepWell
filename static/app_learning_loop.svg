<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="370" viewBox="0 0 1050 370"><rect width="1050" height="370" rx="18" fill="#F4F7F9"/><g font-family="Arial,sans-serif"><text x="45" y="50" font-size="24" font-weight="700" fill="#12324A">A LEARNING LOOP: PREDICT → INVESTIGATE → IMPROVE</text><g><rect x="45" y="115" width="245" height="155" rx="14" fill="#FFFFFF" stroke="#D6E2E8" stroke-width="2"/><circle cx="80" cy="153" r="18" fill="#EAF4F6"/><text x="80" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#2679A5">1</text><text x="110" y="158" font-size="17" font-weight="700" fill="#12324A">Store records</text><text x="70" y="205" font-size="14" fill="#526574">Locations, outcomes,</text><text x="70" y="227" font-size="14" fill="#526574">yield, salinity, status</text></g><path d="M300 190 L355 190" stroke="#27A89A" stroke-width="4"/><path d="M345 180 L357 190 L345 200" fill="none" stroke="#27A89A" stroke-width="4"/><g><rect x="370" y="115" width="285" height="155" rx="14" fill="#EAF4F6" stroke="#B6D9DF" stroke-width="2"/><circle cx="405" cy="153" r="18" fill="#D1EBE9"/><text x="405" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#2679A5">2</text><text x="435" y="158" font-size="17" font-weight="700" fill="#12324A">Analyse predictions</text><text x="395" y="205" font-size="14" fill="#526574">Map uncertainty, gaps,</text><text x="395" y="227" font-size="14" fill="#526574">and informative locations</text></g><path d="M665 190 L720 190" stroke="#27A89A" stroke-width="4"/><path d="M710 180 L722 190 L710 200" fill="none" stroke="#27A89A" stroke-width="4"/><g><rect x="735" y="115" width="270" height="155" rx="14" fill="#FFFFFF" stroke="#D6E2E8" stroke-width="2"/><circle cx="770" cy="153" r="18" fill="#EAF4F6"/><text x="770" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#2679A5">3</text><text x="800" y="158" font-size="17" font-weight="700" fill="#12324A">Collect new data</text><text x="760" y="205" font-size="14" fill="#526574">Investigate selected sites;</text><text x="760" y="227" font-size="14" fill="#526574">validate and retrain</text></g><path d="M870 280 C870 325 160 325 160 280" fill="none" stroke="#27A89A" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M150 289 L160 277 L170 289" fill="none" stroke="#27A89A" stroke-width="2.5"/><text x="525" y="345" text-anchor="middle" font-size="14" fill="#526574">A potential feedback loop—not an automated system yet</text></g></svg>