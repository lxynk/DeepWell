<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="430" viewBox="0 0 1050 430"><rect width="1050" height="430" rx="18" fill="#F4F7F9"/><g font-family="Arial,sans-serif"><text x="45" y="55" font-size="24" font-weight="700" fill="#12324A">FROM RAW RECORDS TO MODELLING DATA</text><text x="45" y="83" font-size="15" fill="#526574">Cleaning and label auditing determine what can be learned</text><g><rect x="45" y="125" width="230" height="210" rx="14" fill="#FFFFFF" stroke="#D6E2E8" stroke-width="2"/><text x="70" y="170" font-size="17" font-weight="700" fill="#12324A">Original records</text><text x="70" y="220" font-size="32" font-weight="700" fill="#2679A5">3,701</text><text x="70" y="250" font-size="14" fill="#526574">Three source datasets</text><text x="70" y="282" font-size="13" fill="#526574">Coordinates • source fields</text><text x="70" y="303" font-size="13" fill="#526574">Status • outcome labels</text></g><path d="M285 230 L335 230" stroke="#27A89A" stroke-width="4"/><path d="M325 220 L337 230 L325 240" fill="none" stroke="#27A89A" stroke-width="4" stroke-linecap="round"/><g><rect x="350" y="125" width="280" height="210" rx="14" fill="#EAF4F6" stroke="#B6D9DF" stroke-width="2"/><text x="375" y="170" font-size="17" font-weight="700" fill="#12324A">Clean and audit</text><text x="375" y="211" font-size="14" fill="#526574">Check coordinates</text><text x="375" y="239" font-size="14" fill="#526574">Resolve conflicting labels</text><text x="375" y="267" font-size="14" fill="#526574">Review missing information</text><text x="375" y="295" font-size="14" fill="#526574">Apply target definitions</text></g><path d="M640 230 L690 230" stroke="#27A89A" stroke-width="4"/><path d="M680 220 L692 230 L680 240" fill="none" stroke="#27A89A" stroke-width="4" stroke-linecap="round"/><g><rect x="705" y="125" width="300" height="210" rx="14" fill="#FFFFFF" stroke="#D6E2E8" stroke-width="2"/><text x="730" y="170" font-size="17" font-weight="700" fill="#12324A">Initial labelled subset</text><text x="730" y="220" font-size="32" font-weight="700" fill="#27A89A">459</text><text x="730" y="250" font-size="14" fill="#526574">174 failures • 285 successes</text><text x="730" y="282" font-size="13" fill="#526574">Not necessarily representative</text><text x="730" y="303" font-size="13" fill="#526574">of all boreholes</text></g></g></svg>